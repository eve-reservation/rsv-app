# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
    push:
        branches:
            - develop
            - uat
permissions:
    checks: write
    contents: read
jobs:
    build_and_deploy_develop:
        if: github.ref == 'refs/heads/develop'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Set environment variables
              run: |
                  cp .env.develop .env
                  echo "Environment variables set for develop"
                  cat .env
            - name: Build project
              run: npm run build
              env:
                  CI: false
                  ESLINT_NO_DEV_ERRORS: true
                  DISABLE_ESLINT_PLUGIN: true
                  SKIP_ESLINT: true
            - name: Deploy to Firebase Develop
              uses: FirebaseExtended/action-hosting-deploy@v0
              with:
                  repoToken: "${{ secrets.GITHUB_TOKEN }}"
                  firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_QCSPORTS_APP_DEV }}"
                  projectId: qcsports-app-dev
                  channelId: live
                  target: develop
                  entryPoint: .

    build_and_deploy_uat:
        if: github.ref == 'refs/heads/uat'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Set environment variables
              run: |
                  cp .env.uat .env
                  echo "Environment variables set for UAT"
                  cat .env
            - name: Build project
              run: npm run build
              env:
                  CI: false
                  ESLINT_NO_DEV_ERRORS: true
                  DISABLE_ESLINT_PLUGIN: true
                  SKIP_ESLINT: true
            - name: Deploy to Firebase UAT
              uses: FirebaseExtended/action-hosting-deploy@v0
              with:
                  repoToken: "${{ secrets.GITHUB_TOKEN }}"
                  firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_QCSPORTS_APP_UAT }}"
                  projectId: qcsports-app-uat
                  channelId: live
                  target: uat
                  entryPoint: .
