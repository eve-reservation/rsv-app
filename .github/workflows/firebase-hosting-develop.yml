name: Deploy Develop

on:
    push:
        branches: [develop]

permissions:
    checks: write
    contents: read

jobs:
    build_and_deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Set environment variables
              run: |
                  cp .env.develop .env
                  echo "Environment variables set for develop"
                  cat .env

            - name: Build project
              run: npm run build
              env:
                  CI: false
                  ESLINT_NO_DEV_ERRORS: true
                  DISABLE_ESLINT_PLUGIN: true
                  SKIP_ESLINT: true

            - name: Configure Firebase target
              run: |
                  echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_QCSPORTS_APP_DEV }}' > ${{ runner.temp }}/gcp-key.json
                  export GOOGLE_APPLICATION_CREDENTIALS="${{ runner.temp }}/gcp-key.json"
                  npm install -g firebase-tools
                  firebase target:apply hosting develop qcsports-app-dev --project qcsports-app-dev

            - name: Deploy to Firebase Develop
              uses: FirebaseExtended/action-hosting-deploy@v0
              with:
                  repoToken: "${{ secrets.GITHUB_TOKEN }}"
                  firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_QCSPORTS_APP_DEV }}"
                  projectId: qcsports-app-dev
                  channelId: live
                  target: develop
                  entryPoint: .
