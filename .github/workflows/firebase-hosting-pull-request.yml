name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
    checks: write
    contents: read
    pull-requests: write
jobs:
    build_and_preview:
        if: "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Set environment variables
              run: |
                  cp .env.develop .env
                  echo "Environment variables set for PR preview"
                  cat .env
            - name: Build project
              run: npm run build
              env:
                  CI: false
                  ESLINT_NO_DEV_ERRORS: true
                  DISABLE_ESLINT_PLUGIN: true
                  SKIP_ESLINT: true
            - name: Create preview firebase.json without targets
              run: |
                  cp firebase.json firebase.json.backup
                  echo '{
                    "hosting": {
                      "public": "build/client",
                      "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
                      "rewrites": [
                        {
                          "source": "**",
                          "destination": "/index.html"
                        }
                      ]
                    }
                  }' > firebase.json
            - name: Deploy to Firebase Hosting Preview
              uses: FirebaseExtended/action-hosting-deploy@v0
              with:
                  repoToken: "${{ secrets.GITHUB_TOKEN }}"
                  firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_QCSPORTS_APP_DEV }}"
                  projectId: qcsport-app-dev
                  entryPoint: .
            - name: Restore original firebase.json
              if: always()
              run: |
                  mv firebase.json.backup firebase.json
